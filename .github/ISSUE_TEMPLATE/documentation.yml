name: "📚 Documentation issue"
description: Report missing, unclear, or inaccurate documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Document path or section
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is unclear or inaccurate?
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested improvement
