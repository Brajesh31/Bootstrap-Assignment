name: 🔐 Repository security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-security-review:
    name: Check for accidental secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check repository files for likely credentials
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          excluded = {".git"}
          patterns = [
              re.compile(r"(?i)(api[_-]?key|access[_-]?token|client[_-]?secret)\s*[:=]\s*['\"]?(?!your_|replace_|example|placeholder)[A-Za-z0-9_./+=-]{20,}"),
              re.compile(r"-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----"),
          ]
          failures = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or any(part in excluded or part == "node_modules" for part in path.parts):
                  continue
              if path.stat().st_size > 2_000_000:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for pattern in patterns:
                  if pattern.search(text):
                      failures.append(str(path))
                      break
          if failures:
              print("Potential secret-like content found. Review these files:")
              print("\n".join(sorted(set(failures))))
              sys.exit(1)
          print("No matching high-confidence secret patterns found.")
          PY
